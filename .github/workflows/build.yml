# Tests the Rust crate and builds the application on both systems.

name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      - name: Test
        working-directory: src-tauri
        run: cargo test

      # The rules against every file of a clean runner. The budget is in
      # content.rs, false_positive_budget.
      - name: False positives
        if: runner.os == 'Linux'
        run: ./scripts/check-false-positives.sh /usr/bin:/usr/sbin:/usr/lib/x86_64-linux-gnu:/usr/share/doc:/etc

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      # The GeoLite2 database is not in the repository, so these builds carry
      # no geolocation data. Everything else works without it.
      - name: Install and build
        run: |
          npm ci
          npx tauri build --no-bundle

      - name: No-trace check
        if: runner.os == 'Linux'
        run: ./scripts/check-build.sh src-tauri/target/release/grt-sentry

      - name: Weight check
        shell: bash
        run: ./scripts/check-weight.sh

      - uses: actions/upload-artifact@v7
        with:
          name: grt-sentry-${{ matrix.os }}
          path: |
            src-tauri/target/release/grt-sentry
            src-tauri/target/release/grt-sentry.exe
          if-no-files-found: error
